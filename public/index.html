<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monkey Clone</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Mobil tarayıcı yükseklik sorununu çözen dinamik yapı */
    html, body { height: 100%; width: 100%; background-color: #0f0f12; color: #fff; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    
    header { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: #16161c; border-bottom: 1px solid #282833; flex-shrink: 0; }
    .logo { color: #ff0055; font-weight: bold; font-size: 20px; }
    
    #main-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; height: calc(100% - 50px); }
    
    /* Profil Kartı */
    #profile-card { background: #1a1a24; padding: 25px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; border: 1px solid #2e2e3e; }
    #profile-card h2 { margin-bottom: 15px; font-size: 20px; }
    .avatars { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .avatar-btn { font-size: 22px; background: #282836; border: 2px solid transparent; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; }
    .avatar-btn.selected { border-color: #ff0055; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0f0f12; color: #fff; margin-bottom: 15px; font-size: 16px; }
    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(90deg, #ff0055, #ff5500); border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }

    /* Video Ekranı - Mobilde Alt Üste, Bilgisayarda Yan Yana */
    #video-container { display: none; width: 100%; height: 100%; position: relative; flex-direction: column; }
    
    @media (min-width: 768px) {
      #video-container { flex-direction: row; }
    }

    video { width: 100%; height: 50%; object-fit: cover; background: #000; }
    @media (min-width: 768px) {
      video { width: 50%; height: 100%; }
      #remote-video { border-left: 2px solid #222; }
    }
    
    /* Butonları Ekranda Yukarıya Sabitleme (Mobil Dostu) */
    #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
    .btn-action { padding: 14px 28px; border-radius: 30px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .btn-next { background: #00cc66; }

    #status-msg { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 18px; border-radius: 20px; z-index: 10; font-size: 14px; white-space: nowrap; }
  </style>
</head>
<body>

  <header>
    <div class="logo">MONKEY ⚡</div>
    <div id="user-info"></div>
  </header>

  <div id="main-area">
    <div id="profile-card">
      <h2>Profil Oluştur</h2>
      <div class="avatars">
        <button class="avatar-btn selected" onclick="selectAvatar('😎', this)">😎</button>
        <button class="avatar-btn" onclick="selectAvatar('🦊', this)">🦊</button>
        <button class="avatar-btn" onclick="selectAvatar('👑', this)">👑</button>
        <button class="avatar-btn" onclick="selectAvatar('🚀', this)">🚀</button>
      </div>
      <input type="text" id="username-input" placeholder="Kullanıcı adın...">
      <button class="btn-submit" onclick="saveProfile()">Uygulamaya Gir</button>
    </div>

    <div id="video-container">
      <div id="status-msg">Hazır! Eşleşmek için butona bas.</div>
      <video id="local-video" autoplay playsinline muted></video>
      <video id="remote-video" autoplay playsinline></video>
      <div id="controls">
        <button class="btn-action btn-next" onclick="nextMatch()">Geç / Eşleş ⏩</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myPeer = null;
    let myPeerId = null;
    let localStream = null;
    let selectedAvatar = '😎';

    function selectAvatar(emoji, btn) {
      document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedAvatar = emoji;
    }

    async function saveProfile() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) return alert('Lütfen bir kullanıcı adı girin!');

      document.getElementById('profile-card').style.display = 'none';
      document.getElementById('video-container').style.display = 'flex';
      document.getElementById('user-info').innerText = selectedAvatar + ' ' + username;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        console.warn('Kamera açılamadı:', err);
      }

      myPeer = new Peer();
      
      myPeer.on('open', id => {
        myPeerId = id;
        socket.emit('profil-kaydet', { username, avatar: selectedAvatar, peerId: id });
      });

      myPeer.on('call', call => {
        call.answer(localStream);
        call.on('stream', remoteStream => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('status-msg').innerText = 'Eşleşti!';
        });
      });
    }

    function nextMatch() {
      document.getElementById('status-msg').innerText = 'Eşleşme aranıyor...';
      socket.emit('eslesme-ara');
    }

    socket.on('bekletiliyor', () => {
      document.getElementById('status-msg').innerText = 'Aranıyor... Biri bekleniyor.';
    });

    socket.on('eslesme-bulundu', (rakipData) => {
      document.getElementById('status-msg').innerText = 'Eşleşildi: ' + rakipData.username;
      if (rakipData.peerId && myPeer) {
        const call = myPeer.call(rakipData.peerId, localStream);
        if (call) {
          call.on('stream', remoteStream => {
            document.getElementById('remote-video').srcObject = remoteStream;
            document.getElementById('status-msg').innerText = 'Eşleşti!';
          });
        }
      }
    });
  </script>
</body>
</html>

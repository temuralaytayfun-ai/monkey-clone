<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monkey Clone</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body { height: 100%; width: 100%; background-color: #0c0c10; color: #fff; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    
    header { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: #16161c; border-bottom: 1px solid #282833; flex-shrink: 0; z-index: 10; }
    .logo { color: #ff0055; font-weight: 800; font-size: 20px; letter-spacing: 1px; }
    
    #main-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; height: calc(100% - 50px); overflow: hidden; }
    
    /* Arka Plan Efekt Işıkları */
    .bg-glow-1 { position: absolute; width: 250px; height: 250px; background: rgba(255, 0, 85, 0.25); filter: blur(90px); border-radius: 50%; top: 15%; left: 10%; pointer-events: none; }
    .bg-glow-2 { position: absolute; width: 250px; height: 250px; background: rgba(255, 170, 0, 0.2); filter: blur(90px); border-radius: 50%; bottom: 15%; right: 10%; pointer-events: none; }

    /* Modern Giriş Paneli Tasarımı */
    #profile-card { 
      position: relative;
      z-index: 2;
      background: rgba(22, 22, 30, 0.75); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 25px 20px; 
      border-radius: 24px; 
      width: 90%; 
      max-width: 360px; 
      text-align: center; 
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,0,85,0.05);
      animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Coin / Bakiye Paneli */
    .coin-badge-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(255, 0, 85, 0.15));
      border: 1px solid rgba(255, 170, 0, 0.3);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .coin-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coin-icon {
      font-size: 22px;
      animation: spinCoin 3s infinite linear;
    }

    @keyframes spinCoin {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    .coin-amount {
      font-weight: 800;
      font-size: 16px;
      color: #ffcc00;
    }

    .btn-buy-coin {
      background: linear-gradient(90deg, #ffaa00, #ff5500);
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(255, 170, 0, 0.4);
      transition: transform 0.2s;
    }

    .btn-buy-coin:active { transform: scale(0.95); }

    #profile-card h2 { margin-bottom: 6px; font-size: 22px; font-weight: 700; }
    #profile-card p.subtitle { font-size: 13px; color: #aaa; margin-bottom: 18px; }

    .avatars { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
    .avatar-btn { 
      font-size: 22px; 
      background: rgba(255, 255, 255, 0.05); 
      border: 2px solid transparent; 
      border-radius: 50%; 
      width: 48px; 
      height: 48px; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .avatar-btn:hover { transform: scale(1.1); }
    .avatar-btn.selected { border-color: #ff0055; background: rgba(255, 0, 85, 0.15); box-shadow: 0 0 12px rgba(255,0,85,0.4); }

    input[type="text"] { 
      width: 100%; 
      padding: 14px; 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      background: rgba(0, 0, 0, 0.4); 
      color: #fff; 
      margin-bottom: 18px; 
      font-size: 15px; 
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #ff0055; }

    .btn-submit { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(90deg, #ff0055, #ff5500); 
      border: none; 
      border-radius: 12px; 
      color: #fff; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); }

    /* Video Alanı & Diğer Bileşenler */
    #video-container { display: none; width: 100%; height: 100%; position: relative; flex-direction: column; }
    
    @media (min-width: 768px) {
      #video-container { flex-direction: row; }
    }

    video { width: 100%; height: 50%; object-fit: cover; background: #000; }
    @media (min-width: 768px) {
      video { width: 50%; height: 100%; }
      #remote-video { border-left: 2px solid #222; }
    }
    
    #chat-overlay {
      position: absolute;
      bottom: 80px;
      left: 15px;
      width: calc(100% - 30px);
      max-width: 360px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #messages {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 5px;
    }

    .msg-item {
      background: rgba(22, 22, 28, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      align-self: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.1);
      word-break: break-word;
    }

    .msg-item.me {
      background: rgba(255, 0, 85, 0.7);
      align-self: flex-end;
    }

    .chat-input-wrapper {
      display: flex;
      gap: 8px;
    }

    #chat-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      background: #ff0055;
      border: none;
      border-radius: 20px;
      padding: 0 16px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    #controls { position: absolute; bottom: 20px; right: 15px; display: flex; gap: 15px; z-index: 100; }
    .btn-action { padding: 12px 22px; border-radius: 30px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .btn-next { background: #00cc66; }

    #status-msg { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 18px; border-radius: 20px; z-index: 10; font-size: 14px; white-space: nowrap; }
  </style>
</head>
<body>

  <header>
    <div class="logo">MONKEY ⚡</div>
    <div id="user-info"></div>
  </header>

  <div id="main-area">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Efektli Giriş & Coin Paneli -->
    <div id="profile-card">
      <div class="coin-badge-container">
        <div class="coin-info">
          <span class="coin-icon">🪙</span>
          <span class="coin-amount" id="user-coins">100 Coin</span>
        </div>
        <button class="btn-buy-coin" onclick="openStore()">+ Coin Al</button>
      </div>

      <h2>Profil Oluştur</h2>
      <p class="subtitle">Eşleşmeye başlamak için ikon ve isim seçin</p>

      <div class="avatars">
        <button class="avatar-btn selected" onclick="selectAvatar('😎', this)">😎</button>
        <button class="avatar-btn" onclick="selectAvatar('🦊', this)">🦊</button>
        <button class="avatar-btn" onclick="selectAvatar('👑', this)">👑</button>
        <button class="avatar-btn" onclick="selectAvatar('🚀', this)">🚀</button>
      </div>

      <input type="text" id="username-input" placeholder="Kullanıcı Adınız...">
      <button class="btn-submit" onclick="saveProfile()">Aramaya Başla 🚀</button>
    </div>

    <div id="video-container">
      <div id="status-msg">Hazır! Eşleşmek için butona bas.</div>
      <video id="local-video" autoplay playsinline muted></video>
      <video id="remote-video" autoplay playsinline></video>

      <div id="chat-overlay">
        <div id="messages"></div>
        <div class="chat-input-wrapper">
          <input type="text" id="chat-input" placeholder="Mesaj yaz..." onkeypress="handleKeyPress(event)">
          <button class="btn-send" onclick="sendMessage()">Gönder</button>
        </div>
      </div>

      <div id="controls">
        <button class="btn-action btn-next" onclick="nextMatch()">Geç / Eşleş ⏩</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myPeer = null;
    let myPeerId = null;
    let localStream = null;
    let currentCall = null;
    let selectedAvatar = '😎';
    let coins = 100; // Varsayılan başlangıç bakiyesi

    function selectAvatar(emoji, btn) {
      document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedAvatar = emoji;
    }

    function openStore() {
      alert("🛒 Coin Mağazası Şablonu:\n\n• 100 Coin = ₺19.99\n• 500 Coin = ₺79.99\n• VIP Üyelik = ₺149.99\n\n(Bu alan yakında aktif olacaktır!)");
    }

    async function saveProfile() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) return alert('Lütfen bir kullanıcı adı girin!');

      document.getElementById('profile-card').style.display = 'none';
      document.getElementById('video-container').style.display = 'flex';
      document.getElementById('user-info').innerText = `🪙 ${coins} | ${selectedAvatar} ${username}`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        console.warn('Kamera açılamadı:', err);
      }

      myPeer = new Peer();
      
      myPeer.on('open', id => {
        myPeerId = id;
        socket.emit('profil-kaydet', { username, avatar: selectedAvatar, peerId: id, coins });
      });

      myPeer.on('call', call => {
        closeCurrentCall();
        currentCall = call;
        call.answer(localStream);
        call.on('stream', remoteStream => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('status-msg').innerText = 'Eşleşti!';
        });
      });
    }

    function closeCurrentCall() {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      const remoteVideo = document.getElementById('remote-video');
      if (remoteVideo.srcObject) {
        remoteVideo.srcObject.getTracks().forEach(track => track.stop());
        remoteVideo.srcObject = null;
      }
    }

    function nextMatch() {
      closeCurrentCall();
      document.getElementById('status-msg').innerText = 'Eşleşme aranıyor...';
      document.getElementById('messages').innerHTML = '';
      socket.emit('eslesme-ara');
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('Sen', text, true);
      socket.emit('mesaj-gonder', { mesaj: text });
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(sender, text, isMe = false) {
      const msgBox = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg-item' + (isMe ? ' me' : '');
      div.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msgBox.appendChild(div);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    socket.on('bekletiliyor', () => {
      document.getElementById('status-msg').innerText = 'Aranıyor... Biri bekleniyor.';
    });

    socket.on('eslesme-bulundu', (rakipData) => {
      document.getElementById('status-msg').innerText = 'Eşleşildi: ' + rakipData.username;
      
      if (rakipData.caller && rakipData.peerId && myPeer) {
        closeCurrentCall();
        const call = myPeer.call(rakipData.peerId, localStream);
        if (call) {
          currentCall = call;
          call.on('stream', remoteStream => {
            document.getElementById('remote-video').srcObject = remoteStream;
            document.getElementById('status-msg').innerText = 'Eşleşti!';
          });
        }
      }
    });

    socket.on('rakip-ayrildi', () => {
      closeCurrentCall();
      document.getElementById('status-msg').innerText = 'Karşı taraf ayrıldı. Yeni kişi aranıyor...';
      document.getElementById('messages').innerHTML = '';
      socket.emit('eslesme-ara');
    });

    socket.on('mesaj-al', (data) => {
      appendMessage(data.gonderen, data.mesaj, false);
    });
  </script>
</body>
</html>

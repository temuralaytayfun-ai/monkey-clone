<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkey Clone</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0f12; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #16161c; border-bottom: 1px solid #282833; }
    .logo { color: #ff0055; font-weight: bold; font-size: 22px; }
    
    #main-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
    
    #profile-card { background: #1a1a24; padding: 30px; border-radius: 16px; width: 340px; text-align: center; border: 1px solid #2e2e3e; }
    #profile-card h2 { margin-bottom: 20px; }
    .avatars { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .avatar-btn { font-size: 24px; background: #282836; border: 2px solid transparent; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; }
    .avatar-btn.selected { border-color: #ff0055; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0f0f12; color: #fff; margin-bottom: 15px; }
    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(90deg, #ff0055, #ff5500); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }

    #video-container { display: none; width: 100%; height: 100%; position: relative; }
    video { width: 50%; height: 100%; object-fit: cover; background: #000; }
    #remote-video { border-left: 2px solid #222; }
    
    #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; }
    .btn-action { padding: 12px 24px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
    .btn-next { background: #00cc66; }
    #status-msg { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; z-index: 10; }
  </style>
</head>
<body>

  <header>
    <div class="logo">MONKEY ⚡</div>
    <div id="user-info"></div>
  </header>

  <div id="main-area">
    <div id="profile-card">
      <h2>Profil Oluştur</h2>
      <div class="avatars">
        <button class="avatar-btn selected" onclick="selectAvatar('😎', this)">😎</button>
        <button class="avatar-btn" onclick="selectAvatar('🦊', this)">🦊</button>
        <button class="avatar-btn" onclick="selectAvatar('👑', this)">👑</button>
        <button class="avatar-btn" onclick="selectAvatar('🚀', this)">🚀</button>
      </div>
      <input type="text" id="username-input" placeholder="Kullanıcı adın...">
      <button class="btn-submit" onclick="saveProfile()">Uygulamaya Gir</button>
    </div>

    <div id="video-container">
      <div id="status-msg">Eşleşmek için "Geç / Eşleş" butonuna bas.</div>
      <video id="local-video" autoplay playsinline muted></video>
      <video id="remote-video" autoplay playsinline></video>
      <div id="controls">
        <button class="btn-action btn-next" onclick="nextMatch()">Geç / Eşleş ⏩</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myPeer = null;
    let myPeerId = null;
    let localStream = null;
    let selectedAvatar = '😎';

    function selectAvatar(emoji, btn) {
      document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedAvatar = emoji;
    }

    async function saveProfile() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) return alert('Lütfen bir kullanıcı adı girin!');

      // Kamera Denemesi (Açılamazsa da Akışa Kesintisiz Devam Et)
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        console.warn('Kamera erişimi sağlanamadı, kamerasız moda geçiliyor:', err);
      }

      document.getElementById('profile-card').style.display = 'none';
      document.getElementById('video-container').style.display = 'flex';
      document.getElementById('user-info').innerText = selectedAvatar + ' ' + username;

      // PeerJS Başlat
      myPeer = new Peer();
      
      myPeer.on('open', id => {
        myPeerId = id;
        socket.emit('profil-kaydet', { username, avatar: selectedAvatar, peerId: id });
      });

      myPeer.on('call', call => {
        call.answer(localStream);
        call.on('stream', remoteStream => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('status-msg').innerText = 'Eşleşti!';
        });
      });
    }

    function nextMatch() {
      if (!myPeerId) return alert('Sunucu bağlantısı henüz kurulmadı!');
      document.getElementById('status-msg').innerText = 'Eşleşme aranıyor...';
      socket.emit('eslesme-ara');
    }

    socket.on('bekletiliyor', () => {
      document.getElementById('status-msg').innerText = 'Biri bekleniyor...';
    });

    socket.on('eslesme-bulundu', (rakipData) => {
      document.getElementById('status-msg').innerText = 'Bağlanılıyor: ' + rakipData.username;
      if (rakipData.peerId && localStream) {
        const call = myPeer.call(rakipData.peerId, localStream);
        call.on('stream', remoteStream => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('status-msg').innerText = 'Eşleşti!';
        });
      }
    });
  </script>
</body>
</html>
